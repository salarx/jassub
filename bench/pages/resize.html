<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JASSUB resize benchmark</title>
  <style>
    body { margin: 0; background: #111; color: #eee; font: 13px/1.5 ui-monospace, monospace; }
    #stage { position: relative; width: 100%; height: 70vh; }
    #wrap { position: absolute; top: 0; left: 0; height: 100%; }
    video { width: 100%; height: 100%; object-fit: contain; display: block; }
    #log { padding: 12px; white-space: pre; font-size: 12px; }
    .JASSUB { image-rendering: auto; }
  </style>
</head>
<body>
  <div id="stage"><div id="wrap"><video id="v" muted loop playsinline></video></div></div>
  <div id="log">idle</div>

<script type="module">
const params    = new URLSearchParams(location.search)
const BUILD     = params.get('build') || 'patched'
const VARIANT   = params.get('variant') || 'all'
const STORM_MS  = +(params.get('storm') || 4000)
const STEADY_MS = +(params.get('steady') || 3000)

const log = m => { document.getElementById('log').textContent = m }
const sleep = ms => new Promise(r => setTimeout(r, ms))

const { default: JASSUB } = await import(`../dist/${BUILD}/jassub.js`)

const A = new URL('../assets', location.href).href
const FONTS = [
  'architext.regular.ttf', 'FRABK.TTF', 'allison-script.regular.otf',
  'Lato-Regular.ttf', 'chawp.otf', 'arial.ttf', 'SlatePro-Medium.otf'
].map(f => `${A}/fonts/${encodeURIComponent(f)}`)

window.addEventListener('error', e => { window.__pageError = String(e.message) })
window.addEventListener('unhandledrejection', e => { window.__pageError = 'rejection: ' + String(e.reason) })
const video = document.getElementById('v')
video.src = `${A}/videos/Beastars.mp4`
await new Promise(r => video.addEventListener('loadedmetadata', r, { once: true }))
await video.play()

// ---- metrics -------------------------------------------------------------
const M = {
  workerMsgs: 0, resizeRpcs: 0,
  longTasks: 0, longTaskMs: 0,
  frames: 0, dropped: 0, mistimed: 0, procSum: 0, procMax: 0,
  drawSum: 0, drawN: 0, drawMax: 0
}
let collecting = false

new PerformanceObserver(list => {
  if (!collecting) return
  for (const e of list.getEntries()) { M.longTasks++; M.longTaskMs += e.duration }
}).observe({ entryTypes: ['longtask'] })

// count worker RPCs, and specifically the ones that reconfigure libass.
// patched on the prototype so it works no matter how abslink captured the endpoint.
const rawPost = Worker.prototype.postMessage
Worker.prototype.postMessage = function (msg, ...rest) {
  if (collecting) {
    M.workerMsgs++
    const path = msg && msg.path
    if (Array.isArray(path) ? path.includes('_resizeCanvas') : /_resizeCanvas/.test(String(msg && msg.path))) M.resizeRpcs++
  }
  return rawPost.call(this, msg, ...rest)
}

// ablation matrix: each variant disables exactly one fix, so variant-vs-all is that fix's contribution
const VARIANTS = {
  all:        {},
  'no-A':     { resizeSettleMs: 0 },                    // no debounce: reconfigure libass on every tick
  'no-B':     { _perf: { entryBox: false } },           // measure the element instead of trusting the entry
  'with-C':   { resizeQuantum: 8 },                     // snapping on, now that it defaults off
  'no-D':     { _perf: { coalesce: false } },           // no in-flight guard on commits
  'no-E':     { _perf: { dedupeStyle: false } },        // write style props even when unchanged
  // D only does anything when A isn't already serialising commits, so measure it against no-A
  'no-A-no-D': { resizeSettleMs: 0, _perf: { coalesce: false } }
}
const opts = VARIANTS[VARIANT]
if (!opts) throw new Error('unknown variant ' + VARIANT)

const instance = new JASSUB({
  video,
  subUrl: `${A}/subtitles/beastars.ass`,
  fonts: FONTS,
  timeOffset: 246.38,
  debug: true,
  queryFonts: false,
  ...opts
})


// Debug.processingDuration is throughput-smoothed AND divided by fps, so it's a rate, not ms.
// time the awaited render round-trip directly instead - same hook for baseline and patched.
const proto = Object.getPrototypeOf(instance)
const origDemand = proto._demandRender
proto._demandRender = async function (...a) {
  const t = performance.now()
  const r = await origDemand.apply(this, a)
  if (collecting) {
    const dt = performance.now() - t
    M.drawSum += dt; M.drawN++
    if (dt > M.drawMax) M.drawMax = dt
  }
  return r
}

instance.debug.onsubtitleFrameCallback = (_, d) => {
  if (!collecting) return
  M.frames++
  M.procSum += d.processingDuration
  if (d.processingDuration > M.procMax) M.procMax = d.processingDuration
  M.dropped = d.droppedFrames
  M.mistimed = d.mistimedFrames
}

window.__instance = instance
window.__stage = 'awaiting ready'
log(`build=${BUILD} awaiting ready…`)
instance.ready.then(() => { window.__stage = 'ready' }, e => { window.__stage = 'ready FAILED: ' + e })
await instance.ready
window.__stage = 'warmup'
log(`build=${BUILD} warming up…`)
await sleep(4000)   // let fonts load and libass caches fill

const snap = () => JSON.parse(JSON.stringify(M))
const diff = (a, b) => {
  const d = Object.fromEntries(Object.keys(b).map(k => [k, b[k] - a[k]]))
  d.procMax = b.procMax   // a max, not a counter
  d.drawMax = b.drawMax
  return d
}

// ---- phase 1: steady state (no resizing) ---------------------------------
const wrap = document.getElementById('wrap')
wrap.style.width = '100%'
await sleep(500)

collecting = true
M.procMax = 0; M.drawMax = 0
const s0 = snap()
log(`build=${BUILD} steady…`)
await sleep(STEADY_MS)
const steady = diff(s0, snap())

// ---- phase 2: resize storm ------------------------------------------------
log(`build=${BUILD} resize storm…`)
M.procMax = 0; M.drawMax = 0
const r0 = snap()
const t0 = performance.now()
await new Promise(done => {
  const step = () => {
    const t = (performance.now() - t0) / STORM_MS
    if (t >= 1) { wrap.style.width = '100%'; return done() }
    // smooth sweep 100% -> 55% -> 100%, a new width every animation frame
    const w = 100 - 45 * Math.sin(t * Math.PI)
    wrap.style.width = w.toFixed(3) + '%'
    requestAnimationFrame(step)
  }
  requestAnimationFrame(step)
})
const stormRaw = diff(r0, snap())

// ---- phase 3: settle ------------------------------------------------------
await sleep(1200)
const storm = diff(r0, snap())
collecting = false

const canvasEl = document.querySelector('canvas')
const fmt = (d, ms) => ({
  frames: d.frames,
  renderCalls: d.drawN,
  avgRenderMs: +(d.drawSum / Math.max(1, d.drawN)).toFixed(3),
  maxRenderMs: +d.drawMax.toFixed(3),
  backingW: canvasEl.width,
  backingH: canvasEl.height,
  avgFrameTimeMs: +(d.procSum / Math.max(1, d.frames)).toFixed(3),
  maxFrameTimeMs: +d.procMax.toFixed(3),
  dropped: d.dropped,
  mistimed: d.mistimed,
  libassReconfigures: d.resizeRpcs,
  workerMessages: d.workerMsgs,
  longTasks: d.longTasks,
  longTaskMs: +d.longTaskMs.toFixed(1),
  blockedPct: +(100 * d.longTaskMs / ms).toFixed(1)
})

const result = {
  build: BUILD,
  variant: VARIANT,
  steady: fmt(steady, STEADY_MS),
  storm: fmt(storm, STORM_MS + 1200),
  stormDuringOnly: fmt(stormRaw, STORM_MS)
}
window.__RESULT = result
log(JSON.stringify(result, null, 2))
</script>
</body>
</html>
