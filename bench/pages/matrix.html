<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>JASSUB track matrix</title>
<style>body{margin:0;background:#111;color:#eee;font:12px ui-monospace,monospace}canvas{display:block}#log{padding:8px;white-space:pre}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080" style="width:960px;height:540px"></canvas>
<pre id="log">idle</pre>
<script type="module">
// Renders every benchmark track at a fixed size across evenly spaced timestamps and hashes the canvas.
// Canvas-only + manualRender, so it is fully deterministic and needs no video decode - two of the upstream
// tracks reference remote videos we deliberately don't depend on.
const p = new URLSearchParams(location.search)
const BUILD = p.get('build') || 'patched'
const RENDERER = p.get('renderer') || 'auto'
const PACKED = p.get('packed') !== '0'
const TRACK = p.get('track') || 'beastars'
const SAMPLES = +(p.get('samples') || 24)
const MRH = +(p.get('mrh') || 0)
const PSF = +(p.get('psf') || 0)

const log = m => { document.getElementById('log').textContent = String(m); window.__s = String(m) }
window.addEventListener('unhandledrejection', e => log('REJ ' + (e.reason?.stack || e.reason)))

const A = new URL('../assets', location.href).href
const F = f => `${A}/fonts/${encodeURIComponent(f)}`
const TRACKS = {
  variable: { sub: 'box.ass', fonts: [] },
  high:     { sub: 'box.ass', fonts: [] },
  simple:   { sub: 'test.ass', fonts: [] },
  fate:     { sub: 'FGOBD.ass', fonts: ['Averia Sans Libre Light.ttf', 'Averia Serif Simple Light.ttf', 'Gramond.ttf'] },
  beastars: { sub: 'beastars.ass', fonts: ['architext.regular.ttf', 'FRABK.TTF', 'allison-script.regular.otf', 'Lato-Regular.ttf', 'chawp.otf', 'arial.ttf', 'SlatePro-Medium.otf'] },
  kusriya:  { sub: 'Kusriya S2 OP1v3.ass', fonts: ['FOT-TsukuCOldMinPr6NR.OTF', 'RoughFlowers.TTF'] }
}
const cfg = TRACKS[TRACK]
if (!cfg) throw new Error('unknown track ' + TRACK)
const subUrl = `${A}/subtitles/${encodeURIComponent(cfg.sub)}`

// derive the track's time range from its own Dialogue lines so sampling covers real content
const text = await (await fetch(subUrl)).text()
const secs = s => { const [h, m, x] = s.split(':'); return (+h) * 3600 + (+m) * 60 + parseFloat(x) }
let lo = Infinity; let hi = 0
for (const m of text.matchAll(/^Dialogue:[^,]*,([^,]+),([^,]+),/gm)) {
  const a = secs(m[1]); const b = secs(m[2])
  if (a < lo) lo = a
  if (b > hi) hi = b
}
if (!isFinite(lo)) { lo = 0; hi = 10 }

const { default: JASSUB } = await import(`../dist/${BUILD}/jassub.js`)
const instance = new JASSUB({
  canvas: document.getElementById('c'),
  subUrl,
  fonts: cfg.fonts.map(F),
  queryFonts: false,
  ...(RENDERER === 'auto' ? {} : { renderer: RENDERER }),
  packed: PACKED,
  ...(MRH ? { maxRenderHeight: MRH } : {}),
  ...(PSF ? { prescaleFactor: PSF } : {})
})
window.__i = instance
await instance.ready
await new Promise(r => setTimeout(r, 2500))

const hashCanvas = async () => {
  const c = document.getElementById('c')
  const bmp = await createImageBitmap(c)
  const off = new OffscreenCanvas(bmp.width, bmp.height)
  const g = off.getContext('2d', { willReadFrequently: true })
  g.drawImage(bmp, 0, 0)
  const d = g.getImageData(0, 0, bmp.width, bmp.height).data
  let h = 2166136261; let lit = 0
  for (let i = 0; i < d.length; i += 4) {
    const a = d[i + 3]
    // Only hash what is actually visible. RGB under alpha 0 is implementation-defined on a premultiplied
    // canvas, so folding it in reports differences between two equally blank frames.
    if (a > 0) {
      lit++
      h ^= d[i] + d[i + 1] * 3 + d[i + 2] * 7 + a * 11
    } else {
      h ^= 0x9e
    }
    h = Math.imul(h, 16777619) >>> 0
  }
  bmp.close()
  // A fully transparent canvas is visually identical whatever its size, and the two builds can differ in
  // backing size on the very first frame while the initial resize settles. Canonicalise it so a blank frame
  // never reports as a rendering difference - the lit counts in the report still catch a wrongly-blank frame.
  return { hash: lit === 0 ? 0 : (h >>> 0), lit, w: bmp.width, h: bmp.height }
}

const frames = []
for (let i = 0; i < SAMPLES; i++) {
  const t = lo + (hi - lo) * (i / (SAMPLES - 1 || 1))
  await instance.manualRender({ expectedDisplayTime: performance.now(), width: 1920, height: 1080, mediaTime: t }, true)
  await new Promise(r => setTimeout(r, 90))
  frames.push({ t: +t.toFixed(3), ...await hashCanvas() })
  log(`${TRACK} ${i + 1}/${SAMPLES}`)
}

window.__RESULT = { track: TRACK, build: BUILD, renderer: RENDERER, packed: PACKED, range: [+lo.toFixed(2), +hi.toFixed(2)], frames }
log(`done ${TRACK}: ${frames.length} frames, ${frames.filter(f => f.lit > 0).length} non-empty`)
</script>
</body>
</html>
